# /etc/pacman.conf — managed by decman (modules/base.py)

[options]
HoldPkg = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Required for steam, lib32-* graphics drivers
[multilib]
Include = /etc/pacman.d/mirrorlist
