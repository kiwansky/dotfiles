# The kyi-ws Bluetooth adapter is a Realtek RTL8761BU USB dongle (0bda:8771).
# With USB autosuspend (the Arch kernel default for btusb) it stops answering
# the first HCI command after a suspend; the kernel logs
# "command 0x2005 tx timeout" / "Resetting usb device" and re-enumerates the
# adapter, which kills every scan within two seconds and wipes device names.
# Persistent form of: echo on > /sys/bus/usb/devices/<dongle>/power/control
options btusb enable_autosuspend=0
